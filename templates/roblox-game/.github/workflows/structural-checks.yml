name: Structural checks (not Roblox Studio QA)
on:
  push:
  pull_request:
jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source-owned starter structure
        run: python3 scripts/verify_game.py
